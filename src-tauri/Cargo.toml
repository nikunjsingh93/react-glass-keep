[package]
name = "glass-keep"
version = "1.0.16"
description = "Glass Keep Windows, macOS and Android client"
authors = ["Nikunj Singh"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "glass_keep_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
base64 = "0.22"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
